plugins {
    id 'com.android.application'
}

android {
    namespace 'com.firefoxgx.browser'
    compileSdk 36

    defaultConfig {
        applicationId 'com.firefoxgx.browser'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
